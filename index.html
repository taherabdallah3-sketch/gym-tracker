<style>
  :root{
    --iron:#0A1128;
    --plate:#101C38;
    --plate-2:#182648;
    --chalk:#FFFFFF;
    --chalk-dim:#8FA3C4;
    --fire:#2F7BFF;
    --fire-dim:#123566;
    --steel:#FFFFFF;
    --steel-dim:#1A2C50;
    --line:#22345A;
    --good:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--iron);color:var(--chalk);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  #app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top, 0px) + 32px) 16px 90px;min-height:100vh;}

  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .brand h1{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1.5px;margin:0;line-height:1;}
  .brand h1 span{color:var(--fire);}
  .brand .date-nav{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--chalk-dim);}
  .date-nav button{background:var(--plate);border:1px solid var(--line);color:var(--chalk);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s, color .15s, transform .1s;}
  .date-nav button:hover{border-color:var(--fire);color:var(--fire);}
  .date-nav button:active{transform:scale(0.92);}
  .date-nav .dlabel{min-width:76px;text-align:center;}
  .gear-btn{background:var(--plate);border:1px solid var(--line);color:var(--chalk-dim);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:14px;flex-shrink:0;transition:border-color .15s, color .15s, transform .1s;}
  .sync-dot{width:9px;height:9px;border-radius:50%;background:var(--chalk-dim);flex-shrink:0;transition:background .2s;}
  .sync-dot.ok{background:var(--good);box-shadow:0 0 6px rgba(255,255,255,.6);}
  .sync-dot.error{background:var(--fire);box-shadow:0 0 6px rgba(47,123,255,.6);}
  .gear-btn:hover{border-color:var(--fire);color:var(--fire);}
  .gear-btn:active{transform:scale(0.92) rotate(20deg);}

  .streak-row{display:flex;gap:10px;margin-bottom:8px;}
  .streak-card{flex:1;background:linear-gradient(160deg, var(--plate) 0%, var(--plate-2) 130%);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 3px 10px rgba(0,0,0,.22);}
  .streak-card .top{display:flex;align-items:center;gap:6px;color:var(--chalk-dim);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;font-weight:700;}
  .streak-card .num{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--fire);line-height:1.25;letter-spacing:.5px;}
  .streak-card .num-unit{font-size:13px;color:var(--chalk-dim);font-family:'Inter',sans-serif;letter-spacing:0;margin-left:2px;}
  .streak-card.meals .num{color:var(--steel);}
  .plates-row{display:flex;gap:3px;margin-top:9px;}
  .plate-dot{width:100%;height:6px;border-radius:3px;background:var(--plate-2);}
  .plate-dot.on{background:var(--fire);box-shadow:0 0 6px rgba(47,123,255,.5);}
  .streak-card.meals .plate-dot.on{background:var(--steel);box-shadow:0 0 6px rgba(255,255,255,.5);}

  .volume-strip{display:flex;align-items:center;justify-content:space-between;background:var(--plate);border:1px solid var(--line);border-radius:11px;padding:9px 15px;margin-bottom:16px;}
  .vol-label{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
  .vol-num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13.5px;color:var(--chalk);}

  .tabs{display:flex;gap:5px;margin-bottom:18px;background:var(--plate);padding:4px;border-radius:12px;border:1px solid var(--line);}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:13px;font-weight:700;color:var(--chalk-dim);cursor:pointer;letter-spacing:.3px;transition:background .15s, color .15s;}
  .tab:hover{color:var(--chalk);}
  .tab.active{background:var(--fire);color:#181818;box-shadow:0 2px 8px rgba(47,123,255,.35);}

  .day-label-banner{background:var(--steel-dim);border:1px solid var(--steel);color:var(--chalk);font-size:12.5px;font-weight:700;padding:9px 13px;border-radius:10px;margin-bottom:14px;letter-spacing:.3px;}
  .day-label-banner.future{background:var(--plate-2);border:1px dashed var(--line);color:var(--chalk-dim);font-weight:600;}

  .sched-day{background:var(--plate);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;overflow:hidden;}
  .sched-day summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px;}
  .sched-day summary::-webkit-details-marker{display:none;}
  .sched-day .sday{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;color:var(--fire);min-width:44px;}
  .sched-day .slabel{font-size:12.5px;color:var(--chalk-dim);}
  .sched-body{padding:0 14px 16px;border-top:1px solid var(--line);}
  .sched-label-input{width:100%;background:var(--plate-2);border:1px solid var(--line);color:var(--chalk);border-radius:9px;padding:9px;font-size:16px;font-family:'Inter',sans-serif;}
  .sched-search{width:100%;background:var(--iron);border:1px solid var(--line);color:var(--chalk);border-radius:9px;padding:8px 11px;font-size:16px;font-family:'Inter',sans-serif;margin-bottom:6px;transition:border-color .15s;}
  .sched-search:focus{outline:none;border-color:var(--fire);}
  .sched-search::placeholder{color:var(--chalk-dim);}
  .sched-sub{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:14px 0 6px;}
  .sched-list{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:4px 8px;}
  .sched-item{display:flex;align-items:center;gap:8px;padding:7px 2px;font-size:13.5px;border-bottom:1px solid var(--line);cursor:pointer;}
  .sched-item:last-child{border-bottom:none;}
  .sched-item input{accent-color:var(--fire);width:15px;height:15px;flex-shrink:0;}

  .section-title{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1px;color:var(--chalk-dim);margin:24px 0 11px;display:flex;align-items:center;justify-content:space-between;}
  .section-title .add-btn{font-family:'Inter',sans-serif;font-size:12px;background:var(--plate);border:1px solid var(--line);color:var(--chalk-dim);padding:6px 13px;border-radius:9px;cursor:pointer;font-weight:700;transition:border-color .15s, color .15s, transform .1s;}
  .section-title .add-btn:hover{border-color:var(--fire);color:var(--fire);}
  .section-title .add-btn:active{transform:scale(0.95);}

  .card{background:var(--plate);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:border-color .15s;}
  .card.done{border-color:var(--good);background:linear-gradient(160deg, rgba(255,255,255,0.10), var(--plate) 60%);}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .card-head .name{font-weight:700;font-size:15.5px;}
  .card-head .sub{font-size:11.5px;color:var(--chalk-dim);margin-top:2px;}

  .check{width:27px;height:27px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;transition:all .15s;}
  .check:hover{border-color:var(--good);}
  .check.on{background:var(--good);border-color:var(--good);color:#0c0c0c;box-shadow:0 0 0 4px rgba(255,255,255,.15);}
  .check:active{transform:scale(0.88);}

  .sets-list{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px;}

function humanDate(ds){

// Merges the plan into whatever is already saved. Matching on name means an
// exercise you already have keeps its id, so its logged history survives.
function seedPlan(){
  if(state.planVersion === PLAN_VERSION) return;
  const norm = s => (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');

  const existing = {};
  (state.exercises||[]).forEach(e=>{ existing[norm(e.name)] = e; });
  const mergedEx = [];
  PLAN_EXERCISES.forEach(pe=>{
    const hit = existing[norm(pe.name)];
    if(hit){
      hit.group = pe.group; hit.target = pe.target; hit.days = pe.days;
      mergedEx.push(hit);
      delete existing[norm(pe.name)];
    } else {
      mergedEx.push({id:pe.id, name:pe.name, group:pe.group, target:pe.target, days:pe.days});
    }
  });
  Object.values(existing).forEach(e=>{
    // Drop anything this file seeded before that is no longer in the plan.
    // Anything you added yourself is kept.
    if(typeof e.id === 'string' && e.id.indexOf('px_')===0) return;
    e.days = e.days || {};
    mergedEx.push(e);
  });
  state.exercises = mergedEx;

  const existingM = {};
  (state.meals||[]).forEach(m=>{ existingM[norm(m.name)] = m; });
  state.meals = PLAN_MEALS.map(pm=>{
    const hit = existingM[norm(pm.name)];
    return {id: hit ? hit.id : pm.id, name:pm.name, time:pm.time, planId:pm.id};
  });

  state.planVersion = PLAN_VERSION;
  saveState();
}

function reloadPlan(){
  if(!confirm('Reload the plan? This restores the training days and meals as written in your plan. Your logged sets are kept.')) return;
  state.planVersion = null;
  seedPlan();
  closeModal();
  render();
}

function planMealById(planId){ return PLAN_MEALS.find(m=>m.id===planId) || null; }

  const mult = CARB_MULT[level];
  const lines = choice.items.map(it=>{
    if(!it.carb) return `<div class="mi"><span>${it.n}</span><span class="mi-amt">${trimNum(it.amt)}${it.unit}</span></div>`;
    if(level==='zero') return `<div class="mi off"><span>${it.n}</span><span class="mi-amt">cut</span></div>`;
    const scaled = trimNum(it.amt*mult)+it.unit;
    const changed = mult !== 1;
    return `<div class="mi carb"><span>${it.n}</span><span class="mi-amt">${scaled}${changed?` <s>${trimNum(it.amt)}${it.unit}</s>`:''}</span></div>`;
  }).join('');
  return `${choice.label?`<div class="mc-label">${choice.label}</div>`:''}<div class="mc-items">${lines}</div>`;
}

async function supabaseGetState(){

async function supabaseSetState(value){

async function handleAuthSubmit(name, code){
  if(!supabaseClient) return;
  authError = '';
  if(!name.trim()){ authError = 'Enter your name.'; renderAuthScreen(); return; }
  if(!/^\d{4}$/.test(code)){ authError = 'Code must be exactly 4 digits.'; renderAuthScreen(); return; }
  authBusy = true;
  renderAuthScreen();
  const email = nameToEmail(name);
  const password = codeToPassword(code);
  try{
    if(authMode === 'signup'){
      const { data, error } = await supabaseClient.auth.signUp({ email, password, options:{ data:{ display_name: name.trim() } } });
      if(error) throw error;
      if(data.user && !data.session){
        authError = 'That name is taken with a different code, or signup needs confirmation — try logging in, or pick a different name.';
        authMode = 'login';
      }
    } else {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error) throw error;
    }
  }catch(e){
    if(e.message && /already registered|already exists/i.test(e.message)){
      authError = 'That name is already taken. Try logging in instead, or pick a different name.';
    } else if(e.message && /invalid login/i.test(e.message)){
      authError = 'Wrong name or code, or that name isn\'t signed up yet.';
    } else {
      authError = e.message || 'Something went wrong. Try again.';
    }
  }
  authBusy = false;
  renderAuthScreen();
}

  if(!supabaseClient) return;

async function loadState(){
  if(USE_SUPABASE){
    if(!supabaseClient){
      // library failed to load (e.g. offline) — fall back to local only
    } else {
      const { data: { session } } = await supabaseClient.auth.getSession();
      currentUser = session ? session.user : null;
      supabaseClient.auth.onAuthStateChange((event, session)=>{
        const newUser = session ? session.user : null;
        const changed = (newUser && newUser.id) !== (currentUser && currentUser.id);
        currentUser = newUser;
        if(changed){
          if(currentUser){ state = {exercises:[],meals:[],logs:{},schedule:{days:{}},settings:{restSeconds:45}}; initialLoad(); }
          else { renderAuthScreen(); }
        }
      });
      if(!currentUser){
        renderAuthScreen();
        return;
      }
    }
  }
  await initialLoad();
}

async function initialLoad(){
  let loadedFromCloud = false;
  if(USE_SUPABASE && currentUser){
    const remote = await supabaseGetState();
    if(remote){ state = remote; loadedFromCloud = true; }
  }
  if(!loadedFromCloud){
    try{
      const res = await storageGet(KEY);
      if(res && res.value){ state = JSON.parse(res.value); }
    }catch(e){ /* no saved data yet */ }
  }
  if(!state.exercises || state.exercises.length===0){
    state.exercises = DEFAULT_EXERCISES.map((e,i)=>({id:'ex_seed_'+i, name:e.name, group:e.group, target:e.target}));
    saveState();
  }
  if(!state.meals || state.meals.length===0){
    state.meals = DEFAULT_MEALS.map((m,i)=>({id:'meal_seed_'+i, name:m.name, time:m.time, notes:m.notes||''}));
    saveState();
  }
  if(!state.settings){ state.settings = {restSeconds:45}; }
  seedPlan();
  render();
}
async function storageGet(key){
  if(HAS_CLAUDE_STORAGE){
    try{ return await window.storage.get(key, false); }
    catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem(key);
    return v ? {key, value:v, shared:false} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(HAS_CLAUDE_STORAGE){
    try{ return await window.storage.set(key, value, false); }
    catch(e){ return null; }
  }
  try{ localStorage.setItem(key, value); return {key, value, shared:false}; }
  catch(e){ return null; }
}

let saveInFlight=false;
let savePending=false;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave, 300);
}
async function doSave(){
  if(saveInFlight){ savePending=true; return; }
  saveInFlight=true;
  const payload = JSON.stringify(state);
  let ok=false;
  for(let attempt=0; attempt<3 && !ok; attempt++){
    try{
      const res = await storageSet(KEY, payload);
      if(res) ok=true;
    }catch(e){
      console.error('save attempt failed', attempt+1, e);
    }
    if(!ok) await new Promise(r=>setTimeout(r, 400*(attempt+1)));
  }
  if(USE_SUPABASE){
    supabaseSetState(state); // fire-and-forget cloud backup, doesn't block local save
  }
  saveInFlight=false;
  if(savePending){ savePending=false; doSave(); }
}

function getLog(ds){
  if(!state.logs[ds]) state.logs[ds] = {exercises:{}, meals:{}};
  return state.logs[ds];

function dayHasActivity(ds, type){
  const log = state.logs[ds];
  if(!log) return false;
  if(type==='training'){
    return Object.values(log.exercises||{}).some(e=> e.done || (e.sets && e.sets.length));
  } else {
    return Object.values(log.meals||{}).some(v=>v===true);
  }
}
function computeStreak(type){
  let streak=0;
  let d=new Date();
  if(!dayHasActivity(fmt(d), type)) d.setDate(d.getDate()-1);
  while(true){
    const ds=fmt(d);
    if(dayHasActivity(ds,type)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function last14(type){
  let arr=[];
  let d=new Date();
  for(let i=13;i>=0;i--){
    let dd=new Date(); dd.setDate(d.getDate()-i);
    arr.push(dayHasActivity(fmt(dd),type));
  }
  return arr;
}

/* ============================================================
   TRAINING BLOCK
   One stored value — settings.blockStart — drives week, day,
   carb level, cardio target and progression target.
   ============================================================ */

const BLOCK_SPLIT = ['Push','Pull','Legs','Off','Upper Body','Lower Body','Off'];

// Day-by-day carb level for each week of the block.
// Counts come straight from the plan; placement follows its own rule:
// high carb on the hardest session (Legs), zero/low on rest days first,
// then the lightest training day.
const CARB_MAP = {
  1: ['low',   'low',    'high', 'low',  'low',    'low',    'low' ],
  2: ['normal','normal', 'high', 'zero', 'normal', 'normal', 'zero'],
  3: ['zero',  'normal', 'high', 'zero', 'normal', 'normal', 'zero'],
  4: ['zero',  'normal', 'high', 'zero', 'zero',   'normal', 'zero']
};
const CARB_MULT = { high:1.5, normal:1, low:0.5, zero:0 };

// The carb item sitting in each meal, at normal-day amounts.
const CARB_ITEMS = [
  {meal:'Meal 1',      item:'Potatoes',   base:100, unit:'g'},
  {meal:'Meal 2',      item:'Potatoes',   base:150, unit:'g'},
  {meal:'Snack',       item:'Banana',     base:1,   unit:''},
  {meal:'Pre-workout', item:'Rice cakes', base:2,   unit:''},
  {meal:'Meal 3',      item:'Rice',       base:100, unit:'g'}
];

const BASE_MACROS = {carb:163, protein:142, fat:41, kcal:1603};

const PROGRESSION = {
  1: {scheme:'3 × 8',  weight:'same weight you finished the last block on'},
  2: {scheme:'3 × 6',  weight:'add 2-5kg to week 1'},
  3: {scheme:'3 × 8',  weight:'hold week 2 weight, push the reps up'},
  4: {scheme:'3 × 6',  weight:'add 2-5kg to week 3'}
};

function blockStartStr(){
  if(!state.settings) state.settings = {restSeconds:45};
  if(!state.settings.blockStart){
    state.settings.blockStart = todayStr();
    saveState();
  }
  return state.settings.blockStart;
}

function daysBetween(a, b){
  return Math.round((Date.parse(b+'T00:00:00Z') - Date.parse(a+'T00:00:00Z')) / 86400000);
}

// Wraps every 28 days, so week 4 rolls into week 1 with no action from you.
function blockPosition(ds){
  const diff = daysBetween(blockStartStr(), ds);
  const n = ((diff % 28) + 28) % 28;
  return { week: Math.floor(n/7)+1, day: (n%7)+1, cycle: Math.floor(diff/28)+1 };
}

// Selecting a week/day doesn't store the week/day — it back-solves the
// start date. That keeps one source of truth and lets it keep advancing.
function setBlockPosition(week, day){
  const offset = (week-1)*7 + (day-1);
  const d = new Date(fmt(viewDate)+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - offset);
  state.settings.blockStart = d.toISOString().slice(0,10);
  saveState();
  closeModal();
  render();
}

function carbLevelFor(ds){
  const p = blockPosition(ds);
  return CARB_MAP[p.week][p.day-1];
}

function adjustedMacros(level){
  const carb = Math.round(BASE_MACROS.carb * CARB_MULT[level]);
  return {
    carb,
    protein: BASE_MACROS.protein,
    fat: BASE_MACROS.fat,
    kcal: Math.round(BASE_MACROS.kcal - (BASE_MACROS.carb - carb) * 4)
  };
}

function cardioMinutes(week){ return week <= 2 ? 20 : 30; }

function trimNum(n){ return (Math.round(n*10)/10).toString(); }

function openBlockModal(){
  closeModal();
  const p = blockPosition(fmt(viewDate));
  const weekOpts = [1,2,3,4].map(w=>`<option value="${w}" ${w===p.week?'selected':''}>Week ${w}</option>`).join('');
  const dayOpts = [1,2,3,4,5,6,7].map(d=>`<option value="${d}" ${d===p.day?'selected':''}>Day ${d} — ${BLOCK_SPLIT[d-1]}</option>`).join('');

}

  const p = blockPosition(ds);

function renderBlockPanel(ds){
  const p = blockPosition(ds);
  const level = CARB_MAP[p.week][p.day-1];
  const mult = CARB_MULT[level];
  const mac = adjustedMacros(level);
  const prog = PROGRESSION[p.week];
  const isRest = BLOCK_SPLIT[p.day-1] === 'Off';

  const rows = CARB_ITEMS.map(c=>{
    const amt = level==='zero' ? '—' : trimNum(c.base*mult) + c.unit;
    return `<div class="carb-row"><span>${c.meal} · ${c.item}</span><span class="carb-amt">${amt}</span></div>`;
  }).join('');

  return `<details class="block-panel">
    <summary>Today's targets</summary>
    <div class="bp-body">
      <div class="bp-sub">Food · ${level} carb day</div>
      <div class="carb-row"><span>Carbs</span><span class="carb-amt">${mac.carb}g</span></div>
      <div class="carb-row"><span>Protein</span><span class="carb-amt">${mac.protein}g</span></div>
      <div class="carb-row"><span>Fat</span><span class="carb-amt">${mac.fat}g</span></div>
      <div class="carb-row"><span>Calories</span><span class="carb-amt">${mac.kcal}</span></div>
      <div class="bp-sub">Carb portions</div>
      ${rows}
      ${level==='zero' ? `<div class="bp-note">Zero carb day — protein and salad only. Everything else in your meals stays the same.</div>` : ''}
      <div class="bp-sub">Training</div>
      <div class="carb-row"><span>Session</span><span class="carb-amt">${BLOCK_SPLIT[p.day-1]}</span></div>
      ${isRest ? '' : `<div class="carb-row"><span>Target scheme</span><span class="carb-amt">${prog.scheme}</span></div>
      <div class="carb-row"><span>Cardio</span><span class="carb-amt">${cardioMinutes(p.week)} min</span></div>
      <div class="bp-note">Week ${p.week}: ${prog.weight}. Cardio is treadmill at 7% incline, heart rate 110-130.</div>`}
    </div>
  </details>`;
}

let wakeLock = null;
async function acquireWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    }
  }catch(e){ /* not supported or denied — no-op */ }
}
function releaseWakeLock(){
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){
    const anyResting = Object.values(exerciseTimers).some(t=>t && t.status==='resting');
    if(anyResting) acquireWakeLock();
  }
});
function formatTime(totalSec){
  totalSec = Math.max(0, Math.round(totalSec));
  if(totalSec < 60) return String(totalSec);
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function getAudioCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(audioCtx.state==='suspended'){ audioCtx.resume(); }
  return audioCtx;
}
function scheduleBeep(ctx, delaySec){
  const t0 = ctx.currentTime + delaySec;
  const nodes = [];
  [0, 0.25].forEach(offset=>{
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001, t0+offset);
    g.gain.exponentialRampToValueAtTime(0.35, t0+offset+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+offset+0.22);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0+offset); o.stop(t0+offset+0.25);
    nodes.push(o);
  });
  return nodes;
}
function vibrateEnd(){
  try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){}
}
function startMovement(exId){
  getAudioCtx(); // warm up audio on a user gesture
  exerciseTimers[exId] = {status:'active'};
  render();
}
function stopMovement(exId){
  const ctx = getAudioCtx();
  const restSeconds = getRestSeconds();
  const beepNodes = scheduleBeep(ctx, restSeconds);
  const startedAt = Date.now();
  exerciseTimers[exId] = {status:'resting', remaining:restSeconds, total:restSeconds, beepNodes, startedAt};
  acquireWakeLock();
  render();
  const intervalId = setInterval(()=>{
    const t = exerciseTimers[exId];
    if(!t || t.status!=='resting'){ clearInterval(intervalId); return; }
    const elapsed = (Date.now()-t.startedAt)/1000;
    const remaining = Math.max(0, restSeconds - elapsed);
    t.remaining = remaining;
    const el = document.getElementById('timer-disp-'+exId);
    if(el) el.textContent = formatTime(remaining);
    const ring = document.getElementById('timer-ring-'+exId);
    if(ring){ ring.style.setProperty('--pct', (remaining/restSeconds)); }
    if(remaining<=0){
      clearInterval(intervalId);
      vibrateEnd();
      const stillResting = !Object.values(exerciseTimers).some(t2=>t2 && t2.status==='resting' && t2!==exerciseTimers[exId]);
      exerciseTimers[exId] = {status:'idle'};
      if(stillResting) releaseWakeLock();
      render();
    }
  }, 200);
  exerciseTimers[exId].intervalId = intervalId;
}
function skipRest(exId){
  const t = exerciseTimers[exId];
  if(t){
    if(t.intervalId) clearInterval(t.intervalId);
    if(t.beepNodes) t.beepNodes.forEach(o=>{ try{o.stop();}catch(e){} });
  }
  exerciseTimers[exId] = {status:'idle'};
  const anyResting = Object.values(exerciseTimers).some(t2=>t2 && t2.status==='resting');
  if(!anyResting) releaseWakeLock();
  render();
}
const ICON_PLAY = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
const ICON_STOP = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;
const ICON_CHECK = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>`;
const ICON_X = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
function renderMoveControl(exId){
  const t = exerciseTimers[exId];
  if(!t || t.status==='idle'){
    return `<button class="timer-btn start" onclick="startMovement('${exId}')">${ICON_PLAY}<span>Start</span></button>`;
  }
  if(t.status==='active'){
    return `<button class="timer-btn stop" onclick="stopMovement('${exId}')">${ICON_STOP}<span>Stop</span></button>`;
  }
  const pct = t.remaining/t.total;
  return `<div class="rest-timer">
    <svg class="rt-ring" id="timer-ring-${exId}" style="--pct:${pct}" viewBox="0 0 40 40">
      <circle class="rt-ring-bg" cx="20" cy="20" r="17"></circle>
      <circle class="rt-ring-fg" cx="20" cy="20" r="17"></circle>
    </svg>
    <span class="rt-num" id="timer-disp-${exId}">${formatTime(t.remaining)}</span>
    <span class="rt-label">rest — get ready to go again</span>
    <button class="timer-btn skip" onclick="skipRest('${exId}')">Skip</button>
  </div>`;
}

function addExercise(name, group, target){
  if(!name.trim()) return;
  state.exercises.push({id:'ex_'+Date.now(), name:name.trim(), group:group||'General', target:target||''});
  saveState(); render();
}
function deleteExercise(id){
  state.exercises = state.exercises.filter(e=>e.id!==id);
  saveState(); closeModal(); render();
}
function addMeal(name, time, notes){
  if(!name.trim()) return;
  state.meals.push({id:'meal_'+Date.now(), name:name.trim(), time:time||'', notes:notes||''});
  saveState(); render();
}
function deleteMeal(id){
  state.meals = state.meals.filter(m=>m.id!==id);
  saveState(); closeModal(); render();
}

    <input id="m-meal-name" placeholder="e.g. Chicken, rice, broccoli" autofocus>

function submitAddMeal(){

function openManageModal(){
  closeModal();
  const div=document.createElement('div');
  div.id='modal-root'; div.className='modal-bg';
  let exRows = state.exercises.map(e=>`<div class="hist-row"><span>${e.name} <span style="color:var(--chalk-dim);font-size:11px">(${e.group})</span></span><span class="x" style="color:#7fb1ff;cursor:pointer;font-size:12px" onclick="deleteExercise('${e.id}')">Remove</span></div>`).join('') || '<div class="empty">No exercises yet</div>';
  let mealRows = state.meals.map(m=>`<div class="hist-row"><span>${m.name}</span><span class="x" style="color:#7fb1ff;cursor:pointer;font-size:12px" onclick="deleteMeal('${m.id}')">Remove</span></div>`).join('') || '<div class="empty">No meals yet</div>';
  div.innerHTML=`<div class="modal" style="max-height:80vh;overflow:auto;">
    <h3>Plan</h3>
    <div class="user-chip">
      <span class="email">Training days &amp; meals from your plan</span>
      <button onclick="reloadPlan()">Reload</button>
    </div>
    ${USE_SUPABASE && currentUser ? `
    <h3>Account</h3>
    <div class="user-chip">
      <span class="email">${(currentUser.user_metadata && currentUser.user_metadata.display_name) || currentUser.email}</span>
      <button onclick="handleLogout()">Log Out</button>
    </div>` : ''}
    <h3>Rest Timer</h3>
    <div class="rest-setting">

      <div class="rest-setting-val">${formatTime(getRestSeconds())}<span>sec rest</span></div>

    <h3 style="margin-top:20px;">Manage Exercises</h3>

      <button class="btn-primary" onclick="closeModal()">Done</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
function refreshManageModal(){
  if(document.getElementById('modal-root')) openManageModal();
}

function shiftDate(n){
  viewDate.setDate(viewDate.getDate()+n);
  render();
}

function switchTab(t){ currentTab=t; render(); }

function computeDayVolume(ds){
  const log = state.logs[ds];
  if(!log) return 0;
  let total=0;
  Object.values(log.exercises||{}).forEach(e=>{
    (e.sets||[]).forEach(s=>{ total += (s.weight||0)*(s.reps||0); });
  });
  return total;
}

function renderStreaks(){
  const tStreak=computeStreak('training');
  const mStreak=computeStreak('meals');
  const tDots=last14('training').map(on=>`<div class="plate-dot ${on?'on':''}"></div>`).join('');
  const mDots=last14('meals').map(on=>`<div class="plate-dot ${on?'on':''}"></div>`).join('');
  const volume = computeDayVolume(fmt(viewDate));
  return `<div class="streak-row">
    <div class="streak-card">
      <div class="top">🔥 Training streak</div>
      <div class="num">${tStreak} <span class="num-unit">day${tStreak===1?'':'s'}</span></div>
      <div class="plates-row">${tDots}</div>
    </div>
    <div class="streak-card meals">
      <div class="top">🍽 Nutrition streak</div>
      <div class="num">${mStreak} <span class="num-unit">day${mStreak===1?'':'s'}</span></div>
      <div class="plates-row">${mDots}</div>
    </div>
  </div>
  <div class="volume-strip"><span class="vol-label">Volume this day</span><span class="vol-num">${volume.toLocaleString()} kg</span></div>`;
}

const DAY_KEYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_ORDER=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function ensureDay(day){
  if(!state.schedule) state.schedule={days:{}};
  if(!state.schedule.days[day]) state.schedule.days[day]={label:'', exercises:[], meals:[]};
  return state.schedule.days[day];
}
function getDaySchedule(day){
  return (state.schedule && state.schedule.days[day]) || null;
}
function toggleScheduleExercise(day, exId){
  const d=ensureDay(day);
  const idx=d.exercises.indexOf(exId);
  if(idx>-1) d.exercises.splice(idx,1); else d.exercises.push(exId);
  saveState(); render();
}
function toggleScheduleMeal(day, mealId){
  const d=ensureDay(day);
  const idx=d.meals.indexOf(mealId);
  if(idx>-1) d.meals.splice(idx,1); else d.meals.push(mealId);
  saveState(); render();
}
function updateDayLabel(day, val){
  ensureDay(day).label = val;
  saveState();
}
function clearDaySchedule(day){
  if(state.schedule) delete state.schedule.days[day];
  saveState(); render();
}

function renderToday(){
  const ds=fmt(viewDate);
  const log=getLog(ds);
  const dayKey = DAY_KEYS[viewDate.getDay()];
  const sched = getDaySchedule(dayKey);
  const bp = blockPosition(ds);
  const carbLevel = CARB_MAP[bp.week][bp.day-1];
  const planForDay = state.exercises
    .filter(e=>e.days && e.days[bp.day]!=null)
    .sort((a,b)=>a.days[bp.day]-b.days[bp.day]);
  const exList = planForDay.length ? planForDay
                 : (sched ? state.exercises.filter(e=>sched.exercises.includes(e.id)) : state.exercises);
  const mealList = state.meals.length ? state.meals
                 : (sched ? state.meals.filter(m=>sched.meals.includes(m.id)) : state.meals);

  let exCards = exList.map(ex=>{
    const entry = log.exercises[ex.id] || {done:false,sets:[]};
    const chips = entry.sets.map((s,i)=>`<div class="set-chip">${s.weight}kg × ${s.reps} <span class="x" onclick="removeSet('${ex.id}',${i})">${ICON_X}</span></div>`).join('');
    const last = lastSessionFor(ex.id, ds);
    const lastLine = last ? `Last time (${humanDate(last.date)}): ${last.sets.map(s=>s.weight+'kg×'+s.reps).join(', ')}` : 'No history yet';
    return `<div class="card ${entry.done?'done':''}">
      <div class="card-head">
        <div>
          <div class="name">${ex.name}</div>
          <div class="sub">${ex.group}${ex.target ? ' • '+ex.target : ''}</div>
        </div>
        <div class="check ${entry.done?'on':''}" onclick="toggleExerciseDone('${ex.id}')">${entry.done?ICON_CHECK:''}</div>
      </div>
      ${chips ? `<div class="sets-list">${chips}</div>` : ''}
      <div class="move-row">${renderMoveControl(ex.id)}</div>
      <div class="add-set">
        <input type="number" placeholder="kg" id="w-${ex.id}" step="0.5">
        <input type="number" placeholder="reps" id="r-${ex.id}">
        <button onclick="addSet('${ex.id}', document.getElementById('w-${ex.id}').value, document.getElementById('r-${ex.id}').value); document.getElementById('w-${ex.id}').value=''; document.getElementById('r-${ex.id}').value='';">+ Set</button>
      </div>
      <div class="last-time">${lastLine}</div>
    </div>`;
  }).join('') || (sched ? `<div class="empty">${sched.label || 'Rest day'} — nothing scheduled. Edit this in the Schedule tab.</div>` : `<div class="empty">No exercises yet — tap "+ Add" to build your training list.</div>`);

  let mealCards = mealList.map(m=>{
    const on = !!log.meals[m.id];
    const plan = planMealById(m.planId);
    let body = '';
    if(plan){
      body = `<div class="meal-choices">${plan.choices.map(c=>renderChoice(c, carbLevel)).join('<div class="mc-or">or</div>')}</div>`;
    } else if(m.notes){
      body = `<div class="meal-notes">${m.notes.split('\\n').map(l=>`<div>${l}</div>`).join('')}</div>`;
    }
    return `<div class="card ${on?'done':''}">
      <div class="card-head">
        <div>
          <div class="name">${m.name}</div>
          ${m.time ? `<div class="sub">${m.time}</div>` : ''}
        </div>
        <div class="check ${on?'on':''}" onclick="toggleMealDone('${m.id}')">${on?ICON_CHECK:''}</div>
      </div>
      ${body}
    </div>`;
  }).join('') || `<div class="empty">No meals yet.</div>`;

  return `
    ${ds > todayStr() ? `<div class="day-label-banner future">Previewing ${humanDate(ds)} — logging still works if you get ahead of schedule</div>` : ''}
    ${sched && sched.label ? `<div class="day-label-banner">${dayKey} — ${sched.label}</div>` : ''}
    ${renderBlockStrip(ds)}
    ${renderBlockPanel(ds)}
    <div class="rest-setting rest-setting-compact">
      <button class="stepper-btn" onclick="adjustRestSeconds(-15)">−</button>
      <div class="rest-setting-val">${formatTime(getRestSeconds())}<span>sec rest between sets</span></div>
      <button class="stepper-btn" onclick="adjustRestSeconds(15)">+</button>
    </div>
    <div class="section-title">Training <button class="add-btn" onclick="openAddExerciseModal()">+ Add</button></div>
    ${exCards}
    <div class="section-title">Meals <button class="add-btn" onclick="openAddMealModal()">+ Add</button></div>
    ${mealCards}
    <div class="fab-hint">Send Taher's trainings and meals over anytime — they'll get added here.</div>
    <div class="build-tag">build 2026-07-22-L-training-only</div>
    <div class="build-tag">auth: ${authDiagnostic}</div>
  `;
}

function filterSchedList(listId, query){
  const container = document.getElementById(listId);
  if(!container) return;
  const q = query.trim().toLowerCase();
  Array.from(container.children).forEach(child=>{
    const text = child.textContent.toLowerCase();
    child.style.display = text.includes(q) ? '' : 'none';
  });
}

function renderSchedule(){
  const rows = DAY_ORDER.map(day=>{
    const d = getDaySchedule(day);
    const exListId = 'sched-ex-'+day;
    const mealListId = 'sched-meal-'+day;
    const exChecks = state.exercises.map(ex=>`<label class="sched-item"><input type="checkbox" ${d&&d.exercises.includes(ex.id)?'checked':''} onchange="toggleScheduleExercise('${day}','${ex.id}')"> ${ex.name}</label>`).join('') || `<div class="empty" style="padding:10px;">No exercises yet</div>`;
    const mealChecks = state.meals.map(m=>`<label class="sched-item"><input type="checkbox" ${d&&d.meals.includes(m.id)?'checked':''} onchange="toggleScheduleMeal('${day}','${m.id}')"> ${m.name}</label>`).join('') || `<div class="empty" style="padding:10px;">No meals yet</div>`;
    const summaryText = d ? (d.label || `${d.exercises.length} exercise${d.exercises.length===1?'':'s'}`) : 'Not set — full list shown';
    return `<details class="sched-day">
      <summary><span class="sday">${day}</span><span class="slabel">${summaryText}</span></summary>
      <div class="sched-body">
        <label style="font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.5px;display:block;margin:10px 0 5px;">Day label (optional)</label>
        <input class="sched-label-input" value="${d&&d.label?d.label:''}" placeholder="e.g. Push Day, Rest Day" onchange="updateDayLabel('${day}', this.value)">
        <div class="sched-sub">Exercises</div>
        <input class="sched-search" placeholder="Search exercises..." oninput="filterSchedList('${exListId}', this.value)">
        <div class="sched-list" id="${exListId}">${exChecks}</div>
        <div class="sched-sub">Meals</div>
        <input class="sched-search" placeholder="Search meals..." oninput="filterSchedList('${mealListId}', this.value)">
        <div class="sched-list" id="${mealListId}">${mealChecks}</div>
        ${d ? `<div class="del-row"><span onclick="clearDaySchedule('${day}')">Reset this day to full list</span></div>` : ''}
      </div>
    </details>`;
  }).join('');

  return `
    <div class="section-title">Weekly Schedule</div>
    <div class="rest-setting" style="margin-bottom:16px;">
      <button class="stepper-btn" onclick="adjustRestSeconds(-15)">−</button>
      <div class="rest-setting-val">${formatTime(getRestSeconds())}<span>sec rest between sets</span></div>
      <button class="stepper-btn" onclick="adjustRestSeconds(15)">+</button>
    </div>
    <div class="fab-hint" style="margin-top:0;margin-bottom:14px;">Tap a day to pick its exercises and meals. Days left untouched show your full list.</div>
    ${rows}
  `;
}

function renderProgress(){
  if(!state.exercises.length) return `<div class="empty">Add an exercise first to see progress.</div>`;
  if(!progExerciseId) progExerciseId = state.exercises[0].id;
  const options = state.exercises.map(e=>`<option value="${e.id}" ${e.id===progExerciseId?'selected':''}>${e.name}</option>`).join('');
  const dates = Object.keys(state.logs).filter(d=> state.logs[d].exercises[progExerciseId] && state.logs[d].exercises[progExerciseId].sets.length).sort();
  let maxSoFar = 0;
  let rows = dates.map(ds=>{
    const sets = state.logs[ds].exercises[progExerciseId].sets;
    const maxW = Math.max(...sets.map(s=>s.weight));
    const isPB = maxW > maxSoFar;
    if(maxW>maxSoFar) maxSoFar = maxW;
    const chips = sets.map(s=>`<span class="set-chip" style="margin-left:0">${s.weight}kg×${s.reps}</span>`).join(' ');
    return `<div class="hist-row"><span class="hist-date">${humanDate(ds)}</span><span class="hist-sets">${chips}${isPB?'<span class="pb-tag">PB</span>':''}</span></div>`;
  }).reverse().join('') || `<div class="empty">No sets logged for this exercise yet.</div>`;

  return `
    <div class="section-title">Progress</div>
    <select class="prog-select" onchange="progExerciseId=this.value; render();">${options}</select>
    <div class="card">${rows}</div>
  `;
}

function render(){
  const app=document.getElementById('app');
  const ds=fmt(viewDate);
  app.innerHTML = `
    <div class="brand">
      <h1>IRON<span>LOG</span></h1>
      <div class="date-nav">
        <button onclick="shiftDate(-1)">‹</button>
        <div class="dlabel">${humanDate(ds)}</div>
        <button onclick="shiftDate(1)">›</button>
        ${USE_SUPABASE ? `<span class="sync-dot ${cloudSyncStatus}" title="${cloudSyncStatus==='ok' ? 'Synced to cloud' : cloudSyncStatus==='error' ? 'Cloud sync failed — saved locally only' : 'Connecting to cloud...'}"></span>` : ''}
        <button class="gear-btn" onclick="openManageModal()" title="Manage exercises & meals">⚙</button>
      </div>
    </div>
    ${renderStreaks()}
    <div class="tabs">
      <div class="tab ${currentTab==='today'?'active':''}" onclick="switchTab('today')">Today</div>
      <div class="tab ${currentTab==='schedule'?'active':''}" onclick="switchTab('schedule')">Schedule</div>
      <div class="tab ${currentTab==='progress'?'active':''}" onclick="switchTab('progress')">Progress</div>
    </div>
    ${currentTab==='today' ? renderToday() : currentTab==='schedule' ? renderSchedule() : renderProgress()}
  `;
}

loadState();
