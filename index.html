<style>
  :root{
    --iron:#121314;
    --plate:#1c1e20;
    --plate-2:#26282b;
    --chalk:#EDEAE3;
    --chalk-dim:#9a9d9f;
    --fire:#FF4B2B;
    --fire-dim:#7a2a1c;
    --steel:#5A7A94;
    --steel-dim:#2b3a44;
    --line:#303234;
    --good:#5FBE7A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--iron);color:var(--chalk);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  #app{max-width:640px;margin:0 auto;padding:20px 16px 80px;min-height:100vh;}

  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .brand h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1.5px;margin:0;line-height:1;}
  .brand h1 span{color:var(--fire);}
  .brand .date-nav{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--chalk-dim);}
  .date-nav button{background:var(--plate);border:1px solid var(--line);color:var(--chalk);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1;}
  .date-nav button:hover{border-color:var(--fire);color:var(--fire);}
  .date-nav .dlabel{min-width:78px;text-align:center;}

  .streak-row{display:flex;gap:10px;margin-bottom:16px;}
  .streak-card{flex:1;background:var(--plate);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .streak-card .top{display:flex;align-items:center;gap:6px;color:var(--chalk-dim);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  .streak-card .num{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--fire);line-height:1.1;}
  .streak-card.meals .num{color:var(--steel);}
  .plates-row{display:flex;gap:3px;margin-top:8px;}
  .plate-dot{width:100%;height:6px;border-radius:3px;background:var(--plate-2);}
  .plate-dot.on{background:var(--fire);}
  .streak-card.meals .plate-dot.on{background:var(--steel);}

  .tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--plate);padding:4px;border-radius:10px;border:1px solid var(--line);}
  .tab{flex:1;text-align:center;padding:8px 0;border-radius:7px;font-size:13px;font-weight:600;color:var(--chalk-dim);cursor:pointer;letter-spacing:.3px;}

  .gear-btn{background:var(--plate);border:1px solid var(--line);color:var(--chalk-dim);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;flex-shrink:0;}
  .gear-btn:hover{border-color:var(--fire);color:var(--fire);}

  .day-label-banner{background:var(--steel-dim);border:1px solid var(--steel);color:var(--chalk);font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:9px;margin-bottom:14px;letter-spacing:.3px;}

  .sched-day{background:var(--plate);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;}
  .sched-day summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px;}
  .sched-day summary::-webkit-details-marker{display:none;}
  .sched-day .sday{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;color:var(--fire);min-width:44px;}
  .sched-day .slabel{font-size:12.5px;color:var(--chalk-dim);}
  .sched-body{padding:0 14px 16px;border-top:1px solid var(--line);}
  .sched-label-input{width:100%;background:var(--plate-2);border:1px solid var(--line);color:var(--chalk);border-radius:8px;padding:9px;font-size:13.5px;font-family:'Inter',sans-serif;}
  .sched-sub{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:14px 0 6px;}
  .sched-list{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px;}
  .sched-item{display:flex;align-items:center;gap:8px;padding:7px 2px;font-size:13.5px;border-bottom:1px solid var(--line);cursor:pointer;}
  .sched-item:last-child{border-bottom:none;}
  .sched-item input{accent-color:var(--fire);width:15px;height:15px;flex-shrink:0;}
  .tab.active{background:var(--fire);color:#181818;}

  .section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--chalk-dim);margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
  .section-title .add-btn{font-family:'Inter',sans-serif;font-size:12px;background:none;border:1px solid var(--line);color:var(--chalk-dim);padding:5px 10px;border-radius:7px;cursor:pointer;font-weight:600;}
  .section-title .add-btn:hover{border-color:var(--fire);color:var(--fire);}

  .card{background:var(--plate);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;}
  .card.done{border-color:var(--good);background:linear-gradient(180deg, rgba(95,190,122,0.08), var(--plate));}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}

function fmt(d){ return d.toISOString().slice(0,10); }
function todayStr(){ return fmt(new Date()); }
function humanDate(ds){
  const d=new Date(ds+'T00:00:00');
  const t=new Date(); const tS=fmt(t);
  const y=new Date(t); y.setDate(y.getDate()-1); const yS=fmt(y);
  if(ds===tS) return 'Today';
  if(ds===yS) return 'Yesterday';
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

async function loadState(){
  try{
    const res = await storageGet(KEY);
    if(res && res.value){ state = JSON.parse(res.value); }
  }catch(e){ /* no saved data yet */ }
  if(!state.exercises || state.exercises.length===0){
    state.exercises = DEFAULT_EXERCISES.map((e,i)=>({id:'ex_seed_'+i, name:e.name, group:e.group, target:e.target}));
    saveState();
  }
  if(!state.meals || state.meals.length===0){
    state.meals = DEFAULT_MEALS.map((m,i)=>({id:'meal_seed_'+i, name:m.name, time:m.time, notes:m.notes||''}));
    saveState();
  }
  render();
}
const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
async function storageGet(key){
  if(HAS_CLAUDE_STORAGE){
    try{ return await window.storage.get(key, false); }
    catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem(key);
    return v ? {key, value:v, shared:false} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(HAS_CLAUDE_STORAGE){
    try{ return await window.storage.set(key, value, false); }
    catch(e){ return null; }
  }
  try{ localStorage.setItem(key, value); return {key, value, shared:false}; }
  catch(e){ return null; }
}

let saveInFlight=false;
let savePending=false;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave, 300);
}
async function doSave(){
  if(saveInFlight){ savePending=true; return; }
  saveInFlight=true;
  const payload = JSON.stringify(state);
  let ok=false;
  for(let attempt=0; attempt<3 && !ok; attempt++){
    try{
      const res = await storageSet(KEY, payload);
      if(res) ok=true;
    }catch(e){
      console.error('save attempt failed', attempt+1, e);
    }
    if(!ok) await new Promise(r=>setTimeout(r, 400*(attempt+1)));
  }
  saveInFlight=false;
  if(savePending){ savePending=false; doSave(); }
}

function getLog(ds){
  if(!state.logs[ds]) state.logs[ds] = {exercises:{}, meals:{}};
  return state.logs[ds];
}
function dayHasActivity(ds, type){
  const log = state.logs[ds];
  if(!log) return false;
  if(type==='training'){
    return Object.values(log.exercises||{}).some(e=> e.done || (e.sets && e.sets.length));
  } else {
    return Object.values(log.meals||{}).some(v=>v===true);
  }
}
function computeStreak(type){
  let streak=0;
  let d=new Date();
  if(!dayHasActivity(fmt(d), type)) d.setDate(d.getDate()-1);
  while(true){
    const ds=fmt(d);
    if(dayHasActivity(ds,type)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function last14(type){
  let arr=[];
  let d=new Date();
  for(let i=13;i>=0;i--){
    let dd=new Date(); dd.setDate(d.getDate()-i);
    arr.push(dayHasActivity(fmt(dd),type));
  }
  return arr;
}

function removeSet(exId, idx){

function lastSessionFor(exId, beforeDs){

  if(!dates.length) return null;
  const d = dates[dates.length-1];
  return {date:d, sets: state.logs[d].exercises[exId].sets};
}

const REST_SECONDS = 45;
let exerciseTimers = {}; // exId -> {status:'idle'|'active'|'resting', remaining, intervalId, beepNodes}
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(audioCtx.state==='suspended'){ audioCtx.resume(); }
  return audioCtx;
}
function scheduleBeep(ctx, delaySec){
  const t0 = ctx.currentTime + delaySec;
  const nodes = [];
  [0, 0.25].forEach(offset=>{
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001, t0+offset);
    g.gain.exponentialRampToValueAtTime(0.35, t0+offset+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+offset+0.22);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0+offset); o.stop(t0+offset+0.25);
    nodes.push(o);
  });
  return nodes;
}
function startMovement(exId){
  getAudioCtx(); // warm up audio on a user gesture
  exerciseTimers[exId] = {status:'active'};
  render();
}
function stopMovement(exId){
  const ctx = getAudioCtx();
  const beepNodes = scheduleBeep(ctx, REST_SECONDS);
  const startedAt = Date.now();
  exerciseTimers[exId] = {status:'resting', remaining:REST_SECONDS, beepNodes, startedAt};
  render();
  const intervalId = setInterval(()=>{
    const t = exerciseTimers[exId];
    if(!t || t.status!=='resting'){ clearInterval(intervalId); return; }
    const elapsed = Math.floor((Date.now()-t.startedAt)/1000);
    const remaining = Math.max(0, REST_SECONDS - elapsed);
    t.remaining = remaining;
    const el = document.getElementById('timer-disp-'+exId);
    if(el) el.textContent = remaining;
    if(remaining<=0){
      clearInterval(intervalId);
      exerciseTimers[exId] = {status:'idle'};
      render();
    }
  }, 250);
  exerciseTimers[exId].intervalId = intervalId;
}
function skipRest(exId){
  const t = exerciseTimers[exId];
  if(t){
    if(t.intervalId) clearInterval(t.intervalId);
    if(t.beepNodes) t.beepNodes.forEach(o=>{ try{o.stop();}catch(e){} });
  }
  exerciseTimers[exId] = {status:'idle'};
  render();
}
function renderMoveControl(exId){
  const t = exerciseTimers[exId];
  if(!t || t.status==='idle'){
    return `<button class="timer-btn start" onclick="startMovement('${exId}')">▶ Start</button>`;
  }
  if(t.status==='active'){
    return `<button class="timer-btn stop" onclick="stopMovement('${exId}')">■ Stop</button>`;
  }
  return `<div class="rest-timer">
    <span class="rt-num" id="timer-disp-${exId}">${t.remaining}</span>
    <span class="rt-label">sec rest — get ready to go again</span>
    <button class="timer-btn skip" onclick="skipRest('${exId}')">Skip</button>
  </div>`;
}

}
function toggleScheduleExercise(day, exId){
  const d=ensureDay(day);
  const idx=d.exercises.indexOf(exId);
  if(idx>-1) d.exercises.splice(idx,1); else d.exercises.push(exId);
  saveState(); render();
}
function toggleScheduleMeal(day, mealId){
  const d=ensureDay(day);
  const idx=d.meals.indexOf(mealId);
  if(idx>-1) d.meals.splice(idx,1); else d.meals.push(mealId);
  saveState(); render();
}
function updateDayLabel(day, val){
  ensureDay(day).label = val;
  saveState();
}
function clearDaySchedule(day){
  if(state.schedule) delete state.schedule.days[day];
  saveState(); render();
}

function renderToday(){
  const ds=fmt(viewDate);
  const log=getLog(ds);
  const dayKey = DAY_KEYS[viewDate.getDay()];
  const sched = getDaySchedule(dayKey);
  const exList = sched ? state.exercises.filter(e=>sched.exercises.includes(e.id)) : state.exercises;
  const mealList = sched ? state.meals.filter(m=>sched.meals.includes(m.id)) : state.meals;

  let exCards = exList.map(ex=>{
    const entry = log.exercises[ex.id] || {done:false,sets:[]};
    const chips = entry.sets.map((s,i)=>`<div class="set-chip">${s.weight}kg × ${s.reps} <span class="x" onclick="removeSet('${ex.id}',${i})">✕</span></div>`).join('');
    const last = lastSessionFor(ex.id, ds);
    const lastLine = last ? `Last time (${humanDate(last.date)}): ${last.sets.map(s=>s.weight+'kg×'+s.reps).join(', ')}` : 'No history yet';
    return `<div class="card ${entry.done?'done':''}">
      <div class="card-head">
        <div>
          <div class="name">${ex.name}</div>
          <div class="sub">${ex.group}${ex.target ? ' • '+ex.target : ''}</div>
        </div>
        <div class="check ${entry.done?'on':''}" onclick="toggleExerciseDone('${ex.id}')">${entry.done?'✓':''}</div>
      </div>
      ${chips ? `<div class="sets-list">${chips}</div>` : ''}
      <div class="move-row">${renderMoveControl(ex.id)}</div>
      <div class="add-set">
        <input type="number" placeholder="kg" id="w-${ex.id}" step="0.5">
        <input type="number" placeholder="reps" id="r-${ex.id}">
        <button onclick="addSet('${ex.id}', document.getElementById('w-${ex.id}').value, document.getElementById('r-${ex.id}').value); document.getElementById('w-${ex.id}').value=''; document.getElementById('r-${ex.id}').value='';">+ Set</button>
      </div>
      <div class="last-time">${lastLine}</div>
    </div>`;
  }).join('') || (sched ? `<div class="empty">${sched.label || 'Rest day'} — nothing scheduled. Edit this in the Schedule tab.</div>` : `<div class="empty">No exercises yet — tap "+ Add" to build your training list.</div>`);

  let mealCards = mealList.map(m=>{
    const on = !!log.meals[m.id];
    return `<div class="card ${on?'done':''}">
      <div class="card-head">
        <div>
          <div class="name">${m.name}</div>
          ${m.time ? `<div class="sub">${m.time}</div>` : ''}
        </div>
        <div class="check ${on?'on':''}" onclick="toggleMealDone('${m.id}')">${on?'✓':''}</div>
      </div>
      ${m.notes ? `<div class="meal-notes">${m.notes.split('\n').map(l=>`<div>${l}</div>`).join('')}</div>` : ''}
    </div>`;
  }).join('') || (sched ? `<div class="empty">No meals scheduled for this day.</div>` : `<div class="empty">No meals yet — tap "+ Add" to log what you eat.</div>`);

  return `
    ${sched && sched.label ? `<div class="day-label-banner">${dayKey} — ${sched.label}</div>` : ''}
    <div class="section-title">Training <button class="add-btn" onclick="openAddExerciseModal()">+ Add</button></div>
    ${exCards}
    <div class="section-title">Meals <button class="add-btn" onclick="openAddMealModal()">+ Add</button></div>
    ${mealCards}
    <div class="fab-hint">Send Taher's trainings and meals over anytime — they'll get added here.</div>
  `;
}

function renderSchedule(){
  const rows = DAY_ORDER.map(day=>{
    const d = getDaySchedule(day);
    const exChecks = state.exercises.map(ex=>`<label class="sched-item"><input type="checkbox" ${d&&d.exercises.includes(ex.id)?'checked':''} onchange="toggleScheduleExercise('${day}','${ex.id}')"> ${ex.name}</label>`).join('') || `<div class="empty" style="padding:10px;">No exercises yet</div>`;
    const mealChecks = state.meals.map(m=>`<label class="sched-item"><input type="checkbox" ${d&&d.meals.includes(m.id)?'checked':''} onchange="toggleScheduleMeal('${day}','${m.id}')"> ${m.name}</label>`).join('') || `<div class="empty" style="padding:10px;">No meals yet</div>`;
    const summaryText = d ? (d.label || `${d.exercises.length} exercise${d.exercises.length===1?'':'s'}`) : 'Not set — full list shown';
    return `<details class="sched-day">
      <summary><span class="sday">${day}</span><span class="slabel">${summaryText}</span></summary>
      <div class="sched-body">
        <label style="font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.5px;display:block;margin:10px 0 5px;">Day label (optional)</label>
        <input class="sched-label-input" value="${d&&d.label?d.label:''}" placeholder="e.g. Push Day, Rest Day" onchange="updateDayLabel('${day}', this.value)">
        <div class="sched-sub">Exercises</div>
        <div class="sched-list">${exChecks}</div>
        <div class="sched-sub">Meals</div>
        <div class="sched-list">${mealChecks}</div>
        ${d ? `<div class="del-row"><span onclick="clearDaySchedule('${day}')">Reset this day to full list</span></div>` : ''}
      </div>
    </details>`;
  }).join('');

  return `
    <div class="section-title">Weekly Schedule</div>
    <div class="fab-hint" style="margin-top:0;margin-bottom:14px;">Tap a day to pick its exercises and meals. Days left untouched show your full list.</div>
    ${rows}
  `;
}

function renderProgress(){
  if(!state.exercises.length) return `<div class="empty">Add an exercise first to see progress.</div>`;
  if(!progExerciseId) progExerciseId = state.exercises[0].id;
  const options = state.exercises.map(e=>`<option value="${e.id}" ${e.id===progExerciseId?'selected':''}>${e.name}</option>`).join('');
  const dates = Object.keys(state.logs).filter(d=> state.logs[d].exercises[progExerciseId] && state.logs[d].exercises[progExerciseId].sets.length).sort();
  let maxSoFar = 0;
  let rows = dates.map(ds=>{
    const sets = state.logs[ds].exercises[progExerciseId].sets;
    const maxW = Math.max(...sets.map(s=>s.weight));
    const isPB = maxW > maxSoFar;
    if(maxW>maxSoFar) maxSoFar = maxW;
    const chips = sets.map(s=>`<span class="set-chip" style="margin-left:0">${s.weight}kg×${s.reps}</span>`).join(' ');
    return `<div class="hist-row"><span class="hist-date">${humanDate(ds)}</span><span class="hist-sets">${chips}${isPB?'<span class="pb-tag">PB</span>':''}</span></div>`;
  }).reverse().join('') || `<div class="empty">No sets logged for this exercise yet.</div>`;

  return `
    <div class="section-title">Progress</div>
    <select class="prog-select" onchange="progExerciseId=this.value; render();">${options}</select>
    <div class="card">${rows}</div>
  `;
}

function render(){
  const app=document.getElementById('app');
  const ds=fmt(viewDate);
  app.innerHTML = `
    <div class="brand">
      <h1>IRON<span>LOG</span></h1>
      <div class="date-nav">
        <button onclick="shiftDate(-1)">‹</button>
        <div class="dlabel">${humanDate(ds)}</div>
        <button onclick="shiftDate(1)" ${ds>=todayStr()?'disabled style="opacity:.3"':''}>›</button>
        <button class="gear-btn" onclick="openManageModal()" title="Manage exercises & meals">⚙</button>
      </div>
    </div>
    ${renderStreaks()}
    <div class="tabs">
      <div class="tab ${currentTab==='today'?'active':''}" onclick="switchTab('today')">Today</div>
      <div class="tab ${currentTab==='schedule'?'active':''}" onclick="switchTab('schedule')">Schedule</div>
      <div class="tab ${currentTab==='progress'?'active':''}" onclick="switchTab('progress')">Progress</div>
    </div>
    ${currentTab==='today' ? renderToday() : currentTab==='schedule' ? renderSchedule() : renderProgress()}
  `;
}

loadState();
</script>
